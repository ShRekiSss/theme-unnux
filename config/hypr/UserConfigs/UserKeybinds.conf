# ─── Личные настройки Danze (KooL rice поверх) ───
# Это только «пользовательские» правки — раскладка, меню, бинды.

# Раскладка us/ru, переключение Ctrl+Shift (как в Plasma)
input {
    kb_layout = us,ru
    kb_options = grp:ctrl_shift_toggle
}

# Super отдельно (кнопка Windows) = меню программ (rofi, как в KooL)
bindr = SUPER, SUPER_L, exec, rofi -show drun

# Рандомные обои из папки каждые 5 мин (ротатор KooL, с wallust-палитрой)
exec-once = $UserScripts/WallpaperAutoChange.sh /home/danze/Обои

# Памятка со ВСЕМИ комбинациями: Win + /
bindd = $mainMod, SLASH, памятка: все горячие клавиши, exec, /home/danze/.local/bin/памятка.sh

# окно памятки: плавающее, крупное, по центру
windowrule {
    name = Памятка
    match:title = Памятка
    float = on
    center = on
    size = 820 680
}
