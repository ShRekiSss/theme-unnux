# ══════════════════════════════════════════════════════════════
#   AURORA · hyprlock
# ══════════════════════════════════════════════════════════════

general {
    hide_cursor = true
}

background {
    monitor =
    path      = /home/studen/.local/share/wallpapers/aurora/aurora-blur.png
    blur_passes = 2
    blur_size   = 6
    brightness  = 0.55
    contrast    = 1.0
    noise       = 0.012
}

# ── часы ──────────────────────────────────────────────────────
label {
    monitor =
    text      = $TIME
    color     = rgba(242, 251, 255, 1.0)
    font_size = 108
    font_family = JetBrainsMono Nerd Font
    position  = 0, -230
    halign    = center
    valign    = center
    shadow_passes = 3
    shadow_size   = 10
    shadow_color  = rgba(0, 0, 0, 0.45)
}

# ── дата ──────────────────────────────────────────────────────
label {
    monitor =
    text      = cmd[update:60000] date +"%A, %d %B"
    color     = rgba(169, 188, 205, 1.0)
    font_size = 19
    font_family = JetBrainsMono Nerd Font
    position  = 0, -150
    halign    = center
    valign    = center
}

# ── аватар ────────────────────────────────────────────────────
image {
    monitor =
    path      = /home/studen/.config/hypr/avatar.png
    size      = 118
    position  = 0, -20
    halign    = center
    valign    = center
}

# ── приветствие ───────────────────────────────────────────────
label {
    monitor =
    text      = Добро пожаловать, $USER
    color     = rgba(232, 240, 247, 0.92)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position  = 0, 62
    halign    = center
    valign    = center
}

# ── поле пароля ───────────────────────────────────────────────
input-field {
    monitor =
    size             = 340, 54
    outline_thickness = 2
    rounding         = 14
    outer_color      = rgba(94, 234, 212, 0.55)
    inner_color      = rgba(10, 15, 22, 0.55)
    font_color       = rgba(232, 240, 247, 1.0)
    check_color      = rgba(167, 139, 250, 0.95)
    fail_color       = rgba(244, 114, 182, 1.0)
    capslock_color   = rgba(251, 191, 36, 1.0)
    dots_size        = 0.22
    dots_spacing     = 0.35
    dots_center      = true
    fade_on_empty    = false
    hide_input       = false
    placeholder_text = <span foreground="##8b9aab">Введите пароль…</span>
    fail_text        = <span foreground="##f472b6">Неверный пароль</span>
    position         = 0, 150
    halign           = center
    valign           = center
}

# ── подсказка ─────────────────────────────────────────────────
label {
    monitor =
    text      = Enter — войти   ·   Esc — сбросить
    color     = rgba(139, 154, 171, 0.75)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position  = 0, 214
    halign    = center
    valign    = center
}
