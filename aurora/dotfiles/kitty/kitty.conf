# ══════════════════════════════════════════════════════════════
#   AURORA · kitty
# ══════════════════════════════════════════════════════════════

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5
adjust_line_height 100%

# ── окно ──────────────────────────────────────────────────────
hide_window_decorations yes
window_padding_width    16
background_opacity      0.96
dynamic_background_opacity no
confirm_os_window_close 0

# ── курсор ────────────────────────────────────────────────────
cursor_shape          beam
cursor_beam_thickness 1.6
cursor_trail          0
cursor_trail_decay    0.1 0.4

# ── вкладки ───────────────────────────────────────────────────
tab_bar_min_tabs   2
tab_bar_style      powerline
tab_powerline_style slanted
tab_title_template " {index}: {title} "
active_tab_background   #16232e
active_tab_foreground   #5eead4
inactive_tab_background #0c1219
inactive_tab_foreground #7c8b9c
tab_bar_background      #0a1018

# ── поведение ─────────────────────────────────────────────────
scrollback_lines       10000
enable_audio_bell      no
copy_on_select         clipboard
strip_trailing_spaces  smart
mouse_hide_wait        0
focus_follows_mouse    no
detect_urls            yes
shell                  /bin/zsh

# ── палитра ───────────────────────────────────────────────────
foreground            #e8f0f7
background            #0a1018
selection_foreground  #04120f
selection_background  #5eead4
url_color             #a78bfa
cursor                #5eead4
cursor_text_color     #04120f

color0  #0a1018
color8  #4b5b6b
color1  #fb7185
color9  #fda4af
color2  #5eead4
color10 #99f6e4
color3  #fbbf24
color11 #fcd34d
color4  #a78bfa
color12 #c4b5fd
color5  #f472b6
color13 #f9a8d4
color6  #22d3ee
color14 #67e8f9
color7  #cbd5e1
color15 #f1f5f9

# ── быстрые действия ──────────────────────────────────────────
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+plus  increase_font_size
map ctrl+shift+minus decrease_font_size
map ctrl+shift+0     restore_font_size
