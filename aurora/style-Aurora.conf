# ══════════════════════════════════════════════════════════════
#   AURORA STYLE — поверх Debian/KooL-билда
#   Подключается последним source в hyprland.conf.
#   Функции и комбинации остаются от Debian-билда, меняется только вид.
# ══════════════════════════════════════════════════════════════

general {
    gaps_in     = 6
    gaps_out    = 18
    border_size = 2

    col.active_border   = rgba(5eead4ee) rgba(a78bfaee) 45deg
    col.inactive_border = rgba(8b98a522)
}

decoration {
    rounding       = 14
    rounding_power = 2.2

    active_opacity     = 1.0
    inactive_opacity   = 0.96
    fullscreen_opacity = 1.0

    dim_inactive = false

    shadow {
        enabled      = true
        range        = 12
        render_power = 2
        color        = rgba(00000059)
    }

    blur {
        enabled    = true
        size       = 4
        passes     = 1
        noise      = 0
        vibrancy   = 0.18
        brightness = 0.95
        popups     = true
    }
}

misc {
    font_family = JetBrainsMono Nerd Font
}

# VirtualBox / софтверный рендер
cursor {
    no_hardware_cursors = true
    inactive_timeout    = 5
}

env = WLR_NO_HARDWARE_CURSORS, 1
