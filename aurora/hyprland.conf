#   ▀▀ ▐▀ ▀▀▀▀ ▀▀▀▀ ▀▀ ▀▀ ▀▀▀ ▀▀▀▀▀  ▀      ~/.config/hypr/hyprland.conf
# ============================================================================
#
#   Полезное:
#     hyprctl reload                     — применить правки
#     hyprctl clients                    — список окон
#     Hyprland --verify-config -c FILE   — проверить синтаксис
#
#   Палитра:
#     bg #070b10   surface #0c1117   text #e8f0f7   muted #9fb0c0
#     teal #5eead4   violet #a78bfa   pink #f472b6
#
# ============================================================================


################
### ПРОГРАММЫ ###
################

$mainMod     = SUPER
$terminal    = kitty
$fileManager = thunar
$browser     = firefox
$menu        = rofi -show drun
$scripts     = ~/.config/hypr/scripts


####################
### ПЕРЕМЕННЫЕ СРЕДЫ ###
####################

env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = XCURSOR_THEME, Adwaita
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = GDK_BACKEND, wayland,x11,*
env = MOZ_ENABLE_WAYLAND, 1
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = XDG_SESSION_TYPE, wayland
env = XDG_CURRENT_DESKTOP, Hyprland
# VirtualBox / программный рендер: курсор рисуем сами
env = WLR_NO_HARDWARE_CURSORS, 1


##################
### МОНИТОРЫ    ###
##################

# Автоопределение: предпочтительное разрешение, авто-позиция, масштаб 1.
# Если нужен конкретный режим — раскомментируйте и подставьте своё:
# monitor = Virtual-1, 1920x1080@60, 0x0, 1
monitor = , preferred, auto, 1


#################
### АВТОСТАРТ ###
#################

exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = $HOME/.config/hypr/scripts/wallpaper.sh init
exec-once = $HOME/.config/waybar/launch.sh
exec-once = swaync
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = /usr/libexec/hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


#################
### ОФОРМЛЕНИЕ ###
#################

general {
    gaps_in     = 0
    gaps_out    = 0
    border_size = 4

    col.active_border   = rgba(5eead4ee) rgba(a78bfaee) 45deg
    col.inactive_border = rgba(8b98a522)

    resize_on_border = true
    allow_tearing    = false
    layout           = floating

    snap {
        enabled     = true
        window_gap  = 8
        monitor_gap = 12
    }
}

decoration {
    rounding       = 8
    rounding_power = 2.2

    active_opacity     = 1.0
    inactive_opacity   = 1.0
    fullscreen_opacity = 1.0

    dim_inactive = false
    dim_strength = 0.05

    shadow {
        enabled      = true
        range        = 12
        render_power = 2
        offset       = 0 8
        color        = rgba(00000059)
    }

    blur {
        enabled           = true
        size              = 4
        passes            = 1
        vibrancy          = 0.18
        vibrancy_darkness = 0.0
        noise             = 0
        contrast          = 0.92
        brightness        = 0.95
        new_optimizations = true
        xray              = false
        popups            = true
        popups_ignorealpha = 0.2
    }
}

animations {
    enabled = true

    bezier = wind,     0.05, 0.90, 0.10, 1.00
    bezier = winIn,    0.10, 1.10, 0.10, 1.02
    bezier = winOut,   0.30, -0.20, 0.00, 1.00
    bezier = soft,     0.25, 0.60, 0.30, 1.00
    bezier = liner,    1.00, 1.00, 1.00, 1.00

    animation = global,          1, 8,   default
    animation = windows,         1, 6,   wind, slide
    animation = windowsIn,       1, 6,   winIn, popin 92%
    animation = windowsOut,      1, 5,   winOut, popin 92%
    animation = windowsMove,     1, 5,   wind, slide
    animation = border,          1, 10,  default
    animation = borderangle,     1, 80,  liner, loop
    animation = fade,            1, 7,   soft
    animation = fadeDim,         1, 7,   soft
    animation = workspaces,      1, 7,   wind, slidefade 20%
    animation = specialWorkspace,1, 6,   wind, slidevert
    animation = layers,          1, 4,   soft
    animation = layersIn,        1, 5,   soft, fade
    animation = layersOut,       1, 4,   soft, fade
}

dwindle {
    pseudotile      = false
    preserve_split  = true
    smart_split     = true
    smart_resizing  = true
}

master {
    new_status = master
    mfact      = 0.55
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo   = true
    disable_splash_rendering = true
    font_family             = JetBrainsMono Nerd Font
    splash_font_family      = JetBrainsMono Nerd Font
    vfr                     = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms  = true
    focus_on_activate       = true
}

xwayland {
    force_zero_scaling = true
}

# В VirtualBox аппаратный курсор часто «дёргается» — рисуем программно.
cursor {
    no_hardware_cursors = true
    inactive_timeout    = 5
}


#############
### ВВОД    ###
#############

input {
    kb_layout  = us,ru
    kb_variant = ,
    kb_options = grp:ctrl_shift_toggle
    numlock_by_default = true

    follow_mouse = 1
    sensitivity  = 0
    accel_profile = flat

    repeat_delay = 300
    repeat_rate  = 40

    touchpad {
        natural_scroll       = true
        tap-to-click         = true
        disable_while_typing = true
        scroll_factor        = 0.8
    }
}

gesture = 3, horizontal, workspace
gesture = 4, vertical, workspace

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles   = true
}


##############
### КЛАВИШИ ###
##############

# ── базовое (как в репо theme-unnux) ─────────────────────────
bindd = $mainMod, Return, терминал, exec, $terminal
bindd = $mainMod, D, меню приложений, exec, $menu
bindr = $mainMod, $mainMod_L, exec, $menu
bindd = $mainMod, B, браузер, exec, $browser
bindd = $mainMod, E, файловый менеджер, exec, $fileManager
bindd = $mainMod, Q, закрыть окно, killactive
bindd = CTRL ALT, Delete, выйти из Hyprland, exec, hyprctl dispatch exit 0

# ── блокировка / питание / уведомления ───────────────────────
bindd = $mainMod, L, блокировка, exec, hyprlock
bindd = CTRL ALT, L, блокировка, exec, hyprlock
bindd = $mainMod, Escape, меню выхода, exec, wlogout -p layer-shell
bindd = CTRL ALT, P, меню выхода, exec, wlogout -p layer-shell
bindd = $mainMod SHIFT, N, уведомления, exec, swaync-client -t -sw

# ── утилиты ──────────────────────────────────────────────────
bindd = $mainMod, V, буфер обмена, exec, $scripts/clipboard.sh
bindd = $mainMod ALT, V, буфер обмена, exec, $scripts/clipboard.sh
bindd = $mainMod, W, обои, exec, $scripts/wallpaper.sh
bindd = $mainMod, SLASH, памятка клавиш, exec, $scripts/hotkeys.sh
bindd = $mainMod, H, памятка клавиш, exec, $scripts/hotkeys.sh
bindd = $mainMod SHIFT, K, памятка клавиш, exec, $scripts/hotkeys.sh
bindd = $mainMod CTRL, S, переключатель окон, exec, rofi -show window
bindd = $mainMod CTRL ALT, B, скрыть Waybar, exec, pkill -SIGUSR1 waybar

# ── окна ─────────────────────────────────────────────────────
bindd = $mainMod, F, fullscreen, fullscreen, 0
bindd = $mainMod SHIFT, F, полный fullscreen, fullscreen, 1
bindd = $mainMod CTRL, F, максимизировать, fullscreen, 1
bindd = $mainMod, SPACE, плавающее окно, togglefloating
bindd = $mainMod ALT, SPACE, все окна плавающими, exec, hyprctl dispatch workspaceopt allfloat
bindd = $mainMod, P, pseudo-tile, pseudo
bindd = $mainMod, J, сплит, togglesplit
bindd = $mainMod SHIFT, I, сплит, togglesplit
bindd = $mainMod, M, коэффициент сплита, exec, hyprctl dispatch splitratio 0.3
bindd = $mainMod, I, добавить master, layoutmsg, addmaster
bindd = $mainMod CTRL, D, убрать master, layoutmsg, removemaster
bindd = $mainMod CTRL, Return, поменяться с master, layoutmsg, swapwithmaster
bindd = $mainMod CTRL, O, прозрачность, setprop, active opaque toggle
bindd = $mainMod, G, группа, togglegroup
bindd = $mainMod, Tab, группа вперёд, changegroupactive, f
bindd = $mainMod SHIFT, Tab, группа назад, changegroupactive, b
bindd = $mainMod CTRL, Tab, активное в группе, changegroupactive
bindd = $mainMod CTRL, K, в группу влево, moveintogroup, l
bindd = $mainMod CTRL, L, в группу вправо, moveintogroup, r
bindd = $mainMod CTRL, H, из группы, moveoutofgroup
bindd = ALT, Tab, следующее окно, cyclenext
bindd = ALT, Tab, поднять окно, bringactivetotop

# ── фокус ────────────────────────────────────────────────────
bindd = $mainMod, left, фокус влево, movefocus, l
bindd = $mainMod, right, фокус вправо, movefocus, r
bindd = $mainMod, up, фокус вверх, movefocus, u
bindd = $mainMod, down, фокус вниз, movefocus, d
bindd = ALT, H, фокус влево, movefocus, l
bindd = ALT, K, фокус вверх, movefocus, u
bindd = ALT, J, фокус вниз, movefocus, d
bindd = ALT, L, фокус вправо, movefocus, r

# ── перемещение и размер ─────────────────────────────────────
bindd = $mainMod CTRL, left, переместить влево, movewindow, l
bindd = $mainMod CTRL, right, переместить вправо, movewindow, r
bindd = $mainMod CTRL, up, переместить вверх, movewindow, u
bindd = $mainMod CTRL, down, переместить вниз, movewindow, d
bindd = $mainMod SHIFT, left, размер -50, resizeactive, -50 0
bindd = $mainMod SHIFT, right, размер +50, resizeactive, 50 0
bindd = $mainMod SHIFT, up, размер -50, resizeactive, 0 -50
bindd = $mainMod SHIFT, down, размер +50, resizeactive, 0 50
bindd = ALT SHIFT, H, переместить влево, movewindow, l
bindd = ALT SHIFT, K, переместить вверх, movewindow, u
bindd = ALT SHIFT, J, переместить вниз, movewindow, d
bindd = ALT SHIFT, L, переместить вправо, movewindow, r
bindmd = $mainMod, mouse:272, переместить мышью, movewindow
bindmd = $mainMod, mouse:273, размер мышью, resizewindow

# ── рабочие столы ────────────────────────────────────────────
bindd = $mainMod, code:10, workspace 1, workspace, 1
bindd = $mainMod, code:11, workspace 2, workspace, 2
bindd = $mainMod, code:12, workspace 3, workspace, 3
bindd = $mainMod, code:13, workspace 4, workspace, 4
bindd = $mainMod, code:14, workspace 5, workspace, 5
bindd = $mainMod, code:15, workspace 6, workspace, 6
bindd = $mainMod, code:16, workspace 7, workspace, 7
bindd = $mainMod, code:17, workspace 8, workspace, 8
bindd = $mainMod, code:18, workspace 9, workspace, 9
bindd = $mainMod, code:19, workspace 10, workspace, 10
bindd = $mainMod SHIFT, code:10, move to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, code:11, move to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, code:12, move to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, code:13, move to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, code:14, move to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, code:15, move to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, code:16, move to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, code:17, move to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, code:18, move to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, code:19, move to workspace 10, movetoworkspace, 10
bindd = $mainMod CTRL, code:10, move silently to workspace 1, movetoworkspacesilent, 1
bindd = $mainMod CTRL, code:11, move silently to workspace 2, movetoworkspacesilent, 2
bindd = $mainMod CTRL, code:12, move silently to workspace 3, movetoworkspacesilent, 3
bindd = $mainMod CTRL, code:13, move silently to workspace 4, movetoworkspacesilent, 4
bindd = $mainMod CTRL, code:14, move silently to workspace 5, movetoworkspacesilent, 5
bindd = $mainMod CTRL, code:15, move silently to workspace 6, movetoworkspacesilent, 6
bindd = $mainMod CTRL, code:16, move silently to workspace 7, movetoworkspacesilent, 7
bindd = $mainMod CTRL, code:17, move silently to workspace 8, movetoworkspacesilent, 8
bindd = $mainMod CTRL, code:18, move silently to workspace 9, movetoworkspacesilent, 9
bindd = $mainMod CTRL, code:19, move silently to workspace 10, movetoworkspacesilent, 10

bindd = $mainMod SHIFT, bracketleft, предыдущий стол, movetoworkspace, -1
bindd = $mainMod SHIFT, bracketright, следующий стол, movetoworkspace, +1
bindd = $mainMod CTRL, bracketleft, молча на предыдущий, movetoworkspacesilent, -1
bindd = $mainMod CTRL, bracketright, молча на следующий, movetoworkspacesilent, +1
bindd = $mainMod, mouse_down, следующий стол, workspace, e+1
bindd = $mainMod, mouse_up, предыдущий стол, workspace, e-1
bindd = $mainMod, period, следующий стол, workspace, e+1
bindd = $mainMod, comma, предыдущий стол, workspace, e-1
bindd = $mainMod, U, специальный стол, togglespecialworkspace
bindd = $mainMod SHIFT, U, на спец. стол, movetoworkspace, special
bindd = $mainMod, grave, special magic, togglespecialworkspace, magic
bindd = $mainMod SHIFT, grave, на special magic, movetoworkspace, special:magic

# ── звук / яркость / медиа ───────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause

# ── скриншоты ────────────────────────────────────────────────
bindd = , Print, скриншот, exec, $scripts/screenshot.sh full
bindd = SHIFT, Print, скриншот области, exec, $scripts/screenshot.sh region
bindd = $mainMod, Print, скриншот, exec, $scripts/screenshot.sh full
bindd = $mainMod SHIFT, Print, скриншот области, exec, $scripts/screenshot.sh region
bindd = $mainMod, S, скриншот области, exec, $scripts/screenshot.sh region

############################
### ОКНА КАК В WINDOWS (floating + decorations)
############################

windowrule {
    name = windows-like-default-size
    match:class = .*
    float  = true
    size   = 1200 800
    center = true
}

windowrule {
    name = windows-like-decorations
    match:class = .*
    decorate = true
}

############################
### ПРАВИЛА ДЛЯ ОКОН       ###
############################

# Диалоги и утилиты — «парят» по центру
windowrule {
    name = float-pavucontrol
    match:class = ^(org\.pavucontrol|pavucontrol)$
    float  = true
    size   = 880 620
    center = true
}

windowrule {
    name = float-blueman
    match:class = ^(blueman-manager|org\.blueman\.manager)$
    float  = true
    size   = 900 640
    center = true
}

windowrule {
    name = float-nm-editor
    match:class = ^(nm-connection-editor)$
    float  = true
    size   = 980 680
    center = true
}

windowrule {
    name = float-file-dialogs
    match:title = ^(Open File|Open Folder|Save File|Открыть|Сохранить)(.*)$
    float  = true
    size   = 1100 720
    center = true
}

windowrule {
    name = float-swaync
    match:class = ^(swaync-blur|swaync-control-center)$
    float = true
}

windowrule {
    name = picture-in-picture
    match:title = ^(Picture-in-Picture|Картинка в картинке)$
    float = true
    pin   = true
    size  = 640 360
}


# Прозрачность/скругления для терминала можно выставить точечно:
# windowrule {
#     name = kitty-opacity
#     match:class = ^(kitty)$
#     opacity = 0.94 0.88
# }


############################
### ПРАВИЛА ДЛЯ СЛОЁВ      ###
############################

layerrule {
    name = blur-waybar
    match:namespace = waybar
    blur         = true
    ignore_alpha = 0.2
}

layerrule {
    name = blur-rofi
    match:namespace = rofi
    blur         = true
    ignore_alpha = 0.2
}

layerrule {
    name = blur-swaync-control-center
    match:namespace = swaync-control-center
    blur         = true
    ignore_alpha = 0.2
}

layerrule {
    name = blur-swaync-notifications
    match:namespace = swaync-notification-window
    blur         = true
    ignore_alpha = 0.2
}

layerrule {
    name = blur-wlogout
    match:namespace = wlogout
    blur         = true
    ignore_alpha = 0.2
}

layerrule {
    name = blur-notifications
    match:namespace = notifications
    blur         = true
    ignore_alpha = 0.2
}


############################
### ПРАВА (0.53+)          ###
############################

permission = /usr/bin/grim, screencopy, allow
permission = /usr/local/bin/hyprpicker, screencopy, allow
permission = /usr/lib/xdg-desktop-portal-hyprland, screencopy, allow
