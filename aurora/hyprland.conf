# ============================================================================
#
#   Полезное:
#     hyprctl reload                     — применить правки
#     hyprctl clients                    — список окон
#     Hyprland --verify-config -c FILE   — проверить синтаксис
#
#   Палитра:
#     bg #070b10   surface #0c1117   text #e8f0f7   muted #9fb0c0
#     teal #5eead4   violet #a78bfa   pink #f472b6
#
# ============================================================================


################
### ПРОГРАММЫ ###
################

$mainMod     = SUPER
$terminal    = kitty
$fileManager = thunar
$browser     = firefox
$menu        = rofi -show drun
$scripts     = ~/.config/hypr/scripts


####################
### ПЕРЕМЕННЫЕ СРЕДЫ ###
####################

env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24
env = XCURSOR_THEME, Adwaita
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = GDK_BACKEND, wayland,x11,*
env = MOZ_ENABLE_WAYLAND, 1
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = XDG_SESSION_TYPE, wayland
env = XDG_CURRENT_DESKTOP, Hyprland
# VirtualBox / программный рендер: курсор рисуем сами
env = WLR_NO_HARDWARE_CURSORS, 1


##################
### МОНИТОРЫ    ###
##################

# Автоопределение: предпочтительное разрешение, авто-позиция, масштаб 1.
# Если нужен конкретный режим — раскомментируйте и подставьте своё:
# monitor = Virtual-1, 1920x1080@60, 0x0, 1
monitor = , preferred, auto, 1


#################
### АВТОСТАРТ ###
#################

exec-once = dbus-update-activation-environment --systemd --all
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = $HOME/.config/hypr/scripts/wallpaper.sh init
exec-once = $HOME/.config/waybar/launch.sh
exec-once = swaync
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = /usr/libexec/hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store


#################
### ОФОРМЛЕНИЕ ###
#################

general {
    gaps_in     = 6
    gaps_out    = 18
    border_size = 2

    col.active_border   = rgba(5eead4ee) rgba(a78bfaee) 45deg
    col.inactive_border = rgba(8b98a522)

    resize_on_border = true
    allow_tearing    = false
    layout           = dwindle

    snap {
        enabled     = true
        window_gap  = 8
        monitor_gap = 12
    }
}

decoration {
    rounding       = 14
    rounding_power = 2.2

    active_opacity     = 1.0
    inactive_opacity   = 0.94
    fullscreen_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.05

    shadow {
        enabled      = true
        range        = 22
        render_power = 3
        offset       = 0 8
        color        = rgba(00000059)
    }

    blur {
        enabled           = true
        size              = 5
        passes            = 2
        vibrancy          = 0.18
        vibrancy_darkness = 0.0
        noise             = 0.02
        contrast          = 0.92
        brightness        = 0.88
        new_optimizations = true
        xray              = false
        popups            = true
        popups_ignorealpha = 0.2
    }
}

animations {
    enabled = true

    bezier = wind,     0.05, 0.90, 0.10, 1.00
    bezier = winIn,    0.10, 1.10, 0.10, 1.02
    bezier = winOut,   0.30, -0.20, 0.00, 1.00
    bezier = soft,     0.25, 0.60, 0.30, 1.00
    bezier = liner,    1.00, 1.00, 1.00, 1.00

    animation = global,          1, 8,   default
    animation = windows,         1, 6,   wind, slide
    animation = windowsIn,       1, 6,   winIn, popin 92%
    animation = windowsOut,      1, 5,   winOut, popin 92%
    animation = windowsMove,     1, 5,   wind, slide
    animation = border,          1, 10,  default
    animation = borderangle,     1, 80,  liner, loop
    animation = fade,            1, 7,   soft
    animation = fadeDim,         1, 7,   soft
    animation = workspaces,      1, 7,   wind, slidefade 20%
    animation = specialWorkspace,1, 6,   wind, slidevert
    animation = layers,          1, 4,   soft
    animation = layersIn,        1, 5,   soft, fade
    animation = layersOut,       1, 4,   soft, fade
}

dwindle {
    pseudotile      = true
    preserve_split  = true
    smart_split     = true
    smart_resizing  = true
}

master {
    new_status = master
    mfact      = 0.55
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo   = true
    disable_splash_rendering = true
    font_family             = JetBrainsMono Nerd Font
    splash_font_family      = JetBrainsMono Nerd Font
    vfr                     = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms  = true
    focus_on_activate       = true
}

xwayland {
    force_zero_scaling = true
}

# В VirtualBox аппаратный курсор часто «дёргается» — рисуем программно.
cursor {
    no_hardware_cursors = true
    inactive_timeout    = 5
}


#############
### ВВОД    ###
#############

input {
    kb_layout  = us,ru
    kb_variant = ,
    kb_options = grp:alt_shift_toggle
    numlock_by_default = true

    follow_mouse = 1
    sensitivity  = 0
    accel_profile = flat

    repeat_delay = 300
    repeat_rate  = 40

    touchpad {
        natural_scroll       = true
        tap-to-click         = true
        disable_while_typing = true
        scroll_factor        = 0.8
    }
}

gesture = 3, horizontal, workspace
gesture = 4, vertical, workspace

binds {
    workspace_back_and_forth = true
    allow_workspace_cycles   = true
}


##############
### КЛАВИШИ ###
##############

# --- базовое ---
bind = $mainMod, Return,      exec, $terminal
bind = $mainMod, D,           exec, $menu
bindr = SUPER, SUPER_L,       exec, rofi -show drun
bind = $mainMod, B,           exec, $browser
bind = $mainMod, E,           exec, $fileManager
bind = $mainMod, Q,           killactive
bind = $mainMod, L,           exec, hyprlock
bind = $mainMod, V,           exec, $scripts/clipboard.sh
bind = $mainMod, S,           exec, $scripts/screenshot.sh region
bind = $mainMod SHIFT, S,     exec, $scripts/screenshot.sh full
bind = $mainMod, Escape,      exec, wlogout -p layer-shell
bind = $mainMod SHIFT, E,     exec, wlogout -p layer-shell
bind = $mainMod, W,           exec, $scripts/wallpaper.sh

# --- окна ---
bind = $mainMod, F,           fullscreen, 0
bind = $mainMod SHIFT, F,     fullscreen, 1
bind = $mainMod, Space,       togglefloating
bind = $mainMod, P,           pseudo
bind = $mainMod, J,           togglesplit
bind = $mainMod, Tab,         cyclenext
bind = $mainMod SHIFT, Tab,   cyclenext, prev
bind = ALT, Tab,              exec, rofi -show window
bindm = $mainMod, mouse:272,  movewindow
bindm = $mainMod, mouse:273,  resizewindow

# --- фокус (vim-keys: ALT + HJKL) ---
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = ALT, H,     movefocus, l
bind = ALT, K,     movefocus, u
bind = ALT, J,     movefocus, d
bind = ALT, L,     movefocus, r
bind = $mainMod, period, focusmonitor, +1
bind = $mainMod, comma,  focusmonitor, -1

# --- перемещение окон ---
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d
bind = ALT SHIFT, H,     movewindow, l
bind = ALT SHIFT, K,     movewindow, u
bind = ALT SHIFT, J,     movewindow, d
bind = ALT SHIFT, L,     movewindow, r
bind = $mainMod CTRL, left,   resizeactive, -40 0
bind = $mainMod CTRL, right,  resizeactive, 40 0
bind = $mainMod CTRL, up,     resizeactive, 0 -40
bind = $mainMod CTRL, down,   resizeactive, 0 40

# --- рабочие столы ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1
bind = $mainMod, grave,      togglespecialworkspace, magic
bind = $mainMod SHIFT, grave, movetoworkspace, special:magic

# --- звук и яркость ---
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# --- медиа ---
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous
bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause

# --- скриншоты ---
bind = , Print,        exec, $scripts/screenshot.sh full
bind = SHIFT, Print,   exec, $scripts/screenshot.sh region


############################
### ПРАВИЛА ДЛЯ ОКОН       ###
############################

# Диалоги и утилиты — «парят» по центру
windowrule {
    name = float-pavucontrol
    match:class = ^(org\.pavucontrol|pavucontrol)$
    float  = true
    size   = 880 620
    center = true
}

windowrule {
    name = float-blueman
    match:class = ^(blueman-manager|org\.blueman\.manager)$
    float  = true
    size   = 900 640
    center = true
}

windowrule {
    name = float-nm-editor
    match:class = ^(nm-connection-editor)$
    float  = true
    size   = 980 680
    center = true
}

windowrule {
    name = float-file-dialogs
    match:title = ^(Open File|Open Folder|Save File|Открыть|Сохранить)(.*)$
    float  = true
    size   = 1100 720
    center = true
}

windowrule {
    name = float-swaync
    match:class = ^(swaync-blur|swaync-control-center)$
    float = true
}

windowrule {
    name = picture-in-picture
    match:title = ^(Picture-in-Picture|Картинка в картинке)$
    float = true
    pin   = true
    size  = 640 360
}

windowrule {
    name = fix-xwayland-drags
    match:class     = ^$
    match:title     = ^$
    match:xwayland  = true
    match:float     = true
    match:fullscreen = false
    match:pin       = false
    no_focus = true
}

# Прозрачность/скругления для терминала можно выставить точечно:
# windowrule {
#     name = kitty-opacity
#     match:class = ^(kitty)$
#     opacity = 0.94 0.88
# }


############################
### ПРАВИЛА ДЛЯ СЛОЁВ      ###
############################

layerrule {
    name = blur-waybar
    match:namespace = waybar
    blur         = true
    ignore_alpha = 0.2
}

layerrule {
    name = blur-rofi
    match:namespace = rofi
    blur         = true
    ignore_alpha = 0.2
}

layerrule {
    name = blur-swaync-control-center
    match:namespace = swaync-control-center
    blur         = true
    ignore_alpha = 0.2
}

layerrule {
    name = blur-swaync-notifications
    match:namespace = swaync-notification-window
    blur         = true
    ignore_alpha = 0.2
}

layerrule {
    name = blur-wlogout
    match:namespace = wlogout
    blur         = true
    ignore_alpha = 0.2
}

layerrule {
    name = blur-notifications
    match:namespace = notifications
    blur         = true
    ignore_alpha = 0.2
}


############################
### ПРАВА (0.53+)          ###
############################

permission = /usr/bin/grim, screencopy, allow
permission = /usr/local/bin/hyprpicker, screencopy, allow
permission = /usr/lib/xdg-desktop-portal-hyprland, screencopy, allow
